<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fondo: Cuadrado gris #181717 con bordes redondeados -->
  <rect x="40" y="40" width="320" height="320" rx="48" ry="48" fill="#e4e4e4" />
  
  <!-- Cubo isométrico unificado en una sola figura sin líneas divisorias internas -->
  <g transform="translate(200, 205)">
    <path d="M 0,-115 L 102,-57.5 L 102,57.5 L 0,115 L -102,57.5 L -102,-57.5 Z" fill="#0f0f0f" />
  </g>

  <!-- Siglas CG en blanco, grandes y perfectamente centradas -->
  <text x="200" y="234" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">CG</text>
</svg>